name: test

on:
  push:
    branches: [main, docs/oss-launch]
  pull_request:

jobs:
  test:
    # Real OS runners; account and network access are replaced in tests.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: syntax
        run: python -m compileall -q mag.py
      - name: shell syntax
        shell: bash
        run: bash -n install.sh
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: offline CLI walkthrough
        run: python scripts/demo.py
      - name: install from clone (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh < /dev/null
          "$HOME/.local/bin/mag" --help
      - name: install from clone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:USERPROFILE/.local/bin/mag.cmd" --help
